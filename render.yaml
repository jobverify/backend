version: "1"
services:
  - type: web
    name: jobverify-backend
    runtime: node
    region: oregon
    # Paid, always-on API compute. Review cost before applying this Blueprint.
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --openssl-legacy-provider
      - key: TRUST_PROXY
        value: "1"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JOBVERIFY_PUBLISHING_TOKEN
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GITHUB_PAT
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: TAILORED_RESUME_GITHUB_REPO
        sync: false
      - key: SCRAPER_CONCURRENCY
        sync: false
      - key: WORKDAY_DETAIL_FETCH_CONCURRENCY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_ALLOWED_HOSTNAMES
        sync: false
      - key: TURNSTILE_EXPECTED_ACTION
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: jobverify_alert_bot
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_RELAY_URL
        sync: false
      - key: EMAIL_RELAY_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_RELEASE
        sync: false
      - key: PAYMENT_PROVIDER
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
