name: Jobverify Instagram Video Drafts
on:
  workflow_run:
    workflows: [Jobverify Post-scrape Classification]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '30 3,11 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: jobverify-instagram-video-drafts-production
  cancel-in-progress: false
jobs:
  render:
    if: >-
      vars.SOCIAL_VIDEO_DRAFTS_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer tools
        run: |
          sudo apt-get update -qq
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg ttf-mscorefonts-installer
          python -m pip install --disable-pip-version-check -r scripts/social-video/requirements.txt
      - name: Prepare up to two unapproved job Reels
        run: node scripts/social-video-drafts.js
        env:
          SOCIAL_VIDEO_DRAFTS_API_URL: https://api.jobverify.in/api/social-video-drafts
