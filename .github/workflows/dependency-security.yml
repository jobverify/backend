name: Dependency security

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - workers/gmail-relay/package.json
      - workers/gmail-relay/package-lock.json
      - scripts/auditDependencies.js
      - .github/workflows/dependency-security.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          check-latest: true
      - name: Audit the complete lockfile
        run: npm run audit:dependencies -- --output dependency-audit.json
      - name: Audit the mail relay complete lockfile
        if: always()
        working-directory: workers/gmail-relay
        run: node ../../scripts/auditDependencies.js --output ../../relay-dependency-audit.json
      - name: Retain findings and registry failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit
          path: |
            dependency-audit.json
            relay-dependency-audit.json
          if-no-files-found: error
          retention-days: 14
